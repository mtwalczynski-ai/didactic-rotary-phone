<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mergington High School Activities</title>
    <link rel="stylesheet" href="styles.css" />
    <style>
      /* Add pretty styles for participants section */
      .activity-card {
        border: 1px solid #d3d3d3;
        border-radius: 8px;
        padding: 1em;
        margin-bottom: 1.5em;
        background: #fafbff;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
      }
      .participants-section {
        margin-top: 1em;
        background: #f0f4fa;
        border-radius: 6px;
        padding: 0.75em;
      }
      .participants-section h4 {
        margin: 0 0 0.5em 0;
        font-size: 1em;
        color: #2a4d7a;
      }
      .participants-list {
        margin: 0;
        padding-left: 1.2em;
        color: #333;
      }
      .participants-list li {
        margin-bottom: 0.25em;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Mergington High School</h1>
      <h2>Extracurricular Activities</h2>
    </header>

    <main>
      <section id="activities-container">
        <h3>Available Activities</h3>
        <div id="activities-list">
          <!-- Activities will be loaded here -->
          <p>Loading activities...</p>
        </div>
      </section>

      <section id="signup-container">
        <h3>Sign Up for an Activity</h3>
        <form id="signup-form">
          <div class="form-group">
            <label for="email">Student Email:</label>
            <input
              type="email"
              id="email"
              required
              placeholder="your-email@mergington.edu"
            />
          </div>
          <div class="form-group">
            <label for="activity">Select Activity:</label>
            <select id="activity" required>
              <option value="">-- Select an activity --</option>
              <!-- Activity options will be loaded here -->
            </select>
          </div>
          <button type="submit">Sign Up</button>
        </form>
        <div id="message" class="hidden"></div>
      </section>
    </main>

    <footer>
      <p>&copy; 2023 Mergington High School</p>
    </footer>

    <script src="app.js"></script>
    <script>
      // Patch for demo: render activity cards with participants section
      // This should be replaced by your real app.js logic
      document.addEventListener("DOMContentLoaded", () => {
        const activities = [
          {
            name: "Chess Club",
            description: "Sharpen your mind and compete in tournaments.",
            participants: ["alice@mergington.edu", "bob@mergington.edu"],
          },
          {
            name: "Drama Society",
            description: "Act, direct, and produce school plays.",
            participants: ["carol@mergington.edu"],
          },
        ];
        const activitiesList = document.getElementById("activities-list");
        activitiesList.innerHTML = "";
        activities.forEach((activity) => {
          const card = document.createElement("div");
          card.className = "activity-card";
          card.innerHTML = `
            <h4>${activity.name}</h4>
            <p>${activity.description}</p>
            <div class="participants-section">
              <h4>Participants</h4>
              <ul class="participants-list">
                ${activity.participants.length
                  ? activity.participants.map((p) => `<li>${p}</li>`).join("")
                  : '<li><em>No participants yet</em></li>'}
              </ul>
            </div>
          `;
          activitiesList.appendChild(card);
        });
      });
    </script>
  </body>
</html>
